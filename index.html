<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindo Mall — Control de Personal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
:root{--green:#1D9E75;--green-dark:#0F6E56;--green-light:#E1F5EE;--green-text:#085041;--red:#E24B4A;--red-light:#FCEBEB;--red-text:#791F1F;--amber:#BA7517;--amber-light:#FAEEDA;--amber-text:#633806;--blue:#378ADD;--blue-light:#E6F1FB;--blue-text:#0C447C;--purple:#7F77DD;--purple-light:#EEEDFE;--purple-text:#3C3489;--gray-light:#F1EFE8;--bg:#F7F7F5;--bg2:#fff;--bg3:#F0EEE8;--text:#1a1a1a;--text2:#6b6b6b;--text3:#9b9b9b;--border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.2);--radius:8px;--radius-lg:12px}
body{background:var(--bg);color:var(--text);min-height:100vh}
input,select,textarea{padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg2);font-size:13px;color:var(--text);width:100%;outline:none;transition:border-color .15s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.1)}
.btn{padding:8px 18px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg2);font-size:13px;cursor:pointer;color:var(--text);font-weight:400;transition:all .15s;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:hover{background:var(--bg3)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);border-color:var(--green-dark);color:#fff;font-weight:500}
.btn-primary:hover{background:var(--green-dark)}
.btn-danger{background:var(--red);border-color:#A32D2D;color:#fff}
.btn-danger:hover{background:#A32D2D}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-sm{padding:5px 12px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.b-activo{background:var(--green-light);color:var(--green-text)}
.b-inactivo{background:var(--gray-light);color:#5F5E5A}
.b-despedido{background:var(--red-light);color:var(--red-text)}
.b-incapacitado{background:var(--amber-light);color:var(--amber-text)}
.b-empleado{background:var(--blue-light);color:var(--blue-text)}
.b-supervisor{background:var(--amber-light);color:var(--amber-text)}
.b-gerente{background:var(--purple-light);color:var(--purple-text)}
.b-admin{background:var(--red-light);color:var(--red-text)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px;flex-shrink:0}
.dot-activo{background:var(--green)}
.dot-inactivo{background:#888780}
.dot-despedido{background:var(--red)}
.dot-incapacitado{background:var(--amber)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg)}
label{font-size:12px;color:var(--text2);font-weight:500;display:block;margin-bottom:5px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius-lg);border:1px solid var(--border);width:100%;max-width:660px;display:flex;flex-direction:column;margin:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:1}
.modal-body{padding:22px;flex:1;overflow-y:auto;max-height:70vh}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:500;line-height:1}
.stat-lbl{font-size:12px;color:var(--text2);margin-top:5px}
.emp-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.emp-card:hover{border-color:var(--green);box-shadow:0 2px 12px rgba(29,158,117,.12)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.ponche-block{background:var(--green-light);border-radius:var(--radius);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.ponche-lbl{font-size:10px;color:var(--green-dark);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.ponche-val{font-size:18px;font-weight:600;color:var(--green-text);letter-spacing:1.5px}
.filter-chip{padding:5px 13px;border-radius:20px;font-size:12px;border:1px solid var(--border2);cursor:pointer;background:transparent;color:var(--text2);transition:all .15s;white-space:nowrap;font-family:inherit}
.filter-chip.active{background:var(--green-light);border-color:var(--green);color:var(--green-text);font-weight:500}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:40}
.nav-pill{padding:6px 15px;border-radius:var(--radius);border:none;background:transparent;font-size:13px;cursor:pointer;color:var(--text2);transition:all .15s;font-family:inherit;font-weight:400}
.nav-pill.active{background:var(--bg3);color:var(--text);font-weight:500}
.sup-group{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px}
.sup-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:var(--bg3)}
.sup-body{padding:8px 20px}
.sup-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.sup-row:last-child{border-bottom:none}
.ficha-wrap{border:2px solid var(--green);border-radius:var(--radius-lg);overflow:hidden}
.ficha-top{background:var(--green);padding:14px 18px;display:flex;align-items:center;gap:12px}
.ficha-body{padding:22px;background:var(--bg2)}
.ficha-center{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.ficha-avatar{width:110px;height:110px;border-radius:50%;border:4px solid var(--green);overflow:hidden;display:flex;align-items:center;justify-content:center}
.ficha-ponche{background:var(--green-light);border-radius:var(--radius);padding:8px 22px;text-align:center}
.ficha-table{width:100%;font-size:13px;border-collapse:collapse}
.ficha-table td{padding:7px 0;border-bottom:1px solid var(--border);vertical-align:top}
.ficha-table td:first-child{color:var(--text2);width:38%;padding-right:12px}
.section-title{font-size:14px;font-weight:500;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.photo-upload-area{width:96px;height:96px;border-radius:50%;border:2px dashed var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;overflow:hidden;position:relative;transition:border-color .15s;background:var(--bg3)}
.photo-upload-area:hover{border-color:var(--green)}
.empty{text-align:center;padding:70px 24px;color:var(--text2)}
.empty-icon{font-size:42px;opacity:.25;margin-bottom:12px}
.bar-bg{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;width:80px;flex-shrink:0}
.bar-fill{height:100%;background:var(--green);border-radius:3px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.topbar{padding:0 12px}.content{padding:14px}}
</style>
</head>
<body>

<div id="app"></div>

<!-- MODAL -->
<div id="modal-layer" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-ttl" style="font-size:15px;font-weight:500"></span>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-bdy"></div>
    <div class="modal-footer" id="modal-ftr"></div>
  </div>
</div>

<script>
const CRED={u:'yu',p:'6399'};
let session=false,employees=[],view='empleados',filterRole='all',filterStatus='all',search='',editId=null,fichaId=null,photoData=null;
const AVC=['#1D9E75','#378ADD','#7F77DD','#D85A30','#D4537E','#BA7517'];
const avc=n=>AVC[(n||'A').charCodeAt(0)%AVC.length];
const ini=(a,b)=>((a||'?')[0]+(b||'')[0]).toUpperCase();
const today=()=>new Date().toISOString().split('T')[0];
const fmtDate=d=>{if(!d)return'—';try{return new Date(d+'T12:00').toLocaleDateString('es-DO',{day:'2-digit',month:'short',year:'numeric'})}catch{return d}};
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function loadData(){try{const r=localStorage.getItem('kindo_v3');if(r)employees=JSON.parse(r)}catch(e){employees=[]}render()}
function saveData(){try{localStorage.setItem('kindo_v3',JSON.stringify(employees))}catch(e){}}

function render(){document.getElementById('app').innerHTML=session?appHTML():loginHTML()}

/* ─── LOGIN ─── */
function loginHTML(){return`
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div class="card" style="padding:40px 36px;width:340px;border-radius:16px">
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:56px;height:56px;background:var(--green);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;margin:0 auto 14px">KM</div>
      <div style="font-size:19px;font-weight:600">Kindo Mall</div>
      <div style="font-size:12px;color:var(--text2);margin-top:3px">Sistema de Control de Personal</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:13px">
      <div><label>Usuario</label><input id="l-u" type="text" placeholder="Ingresa tu usuario" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div><label>Contraseña</label><input id="l-p" type="password" placeholder="Ingresa tu contraseña" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div id="l-err" style="display:none;font-size:12px;color:var(--red-text);text-align:center;padding:7px;background:var(--red-light);border-radius:var(--radius)">Usuario o contraseña incorrectos.</div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px" onclick="doLogin()">Iniciar sesión</button>
    </div>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--text3)">Acceso exclusivo · Administrador</div>
  </div>
</div>`}

function doLogin(){
  const u=(document.getElementById('l-u')||{}).value?.trim();
  const p=(document.getElementById('l-p')||{}).value;
  if(u===CRED.u&&p===CRED.p){session=true;render()}
  else{const el=document.getElementById('l-err');if(el)el.style.display='block'}
}
function doLogout(){session=false;render()}

/* ─── APP SHELL ─── */
function appHTML(){
  return`
<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:34px;height:34px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700">KM</div>
    <div>
      <div style="font-size:14px;font-weight:600;line-height:1.2">Kindo Mall</div>
      <div style="font-size:11px;color:var(--text2)">Control de Personal</div>
    </div>
  </div>
  <div style="display:flex;gap:3px">
    ${[['empleados','Personal'],['supervisores','Supervisores'],['dashboard','Resumen']].map(([k,l])=>`<button class="nav-pill${view===k?' active':''}" onclick="setView('${k}')">${l}</button>`).join('')}
  </div>
  <button class="btn btn-ghost btn-sm" onclick="doLogout()">Cerrar sesión</button>
</div>
<div class="content" style="padding:20px;max-width:1200px;margin:0 auto" id="view-area">${viewHTML()}</div>`}

function setView(v){view=v;render()}
function updateView(){const el=document.getElementById('view-area');if(el)el.innerHTML=viewHTML()}
function viewHTML(){
  if(view==='empleados')return empViewHTML();
  if(view==='supervisores')return supViewHTML();
  return dashHTML();
}

/* ─── EMPLEADOS ─── */
function empViewHTML(){
  const roles=['all','empleado','supervisor','gerente','admin'];
  const rLbl={all:'Todos',empleado:'Empleados',supervisor:'Supervisores',gerente:'Gerentes',admin:'Admin'};
  const stats=['all','activo','inactivo','incapacitado','despedido'];
  const sLbl={all:'Todos los estados',activo:'Activo',inactivo:'Inactivo',incapacitado:'Incapacitado',despedido:'Despedido'};
  const list=employees.filter(e=>{
    const s=search.toLowerCase();
    const mS=!s||[e.nombre,e.apellido,e.ponche,e.cargo,e.cedula].join(' ').toLowerCase().includes(s);
    return mS&&(filterRole==='all'||e.rol===filterRole)&&(filterStatus==='all'||e.estado===filterStatus);
  });
  return`
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <input style="flex:1;min-width:220px" placeholder="Buscar por nombre, ponche, cédula o cargo..." oninput="search=this.value;updateView()" value="${esc(search)}">
    <select style="width:170px" onchange="filterStatus=this.value;updateView()">
      ${stats.map(s=>`<option value="${s}"${filterStatus===s?' selected':''}>${sLbl[s]}</option>`).join('')}
    </select>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      ${roles.map(r=>`<button class="filter-chip${filterRole===r?' active':''}" onclick="filterRole='${r}';updateView()">${rLbl[r]}</button>`).join('')}
    </div>
    <button class="btn btn-primary" onclick="openNew()">+ Nuevo empleado</button>
  </div>
  <div style="font-size:12px;color:var(--text2);margin-bottom:12px">${list.length} empleado${list.length!==1?'s':''} encontrado${list.length!==1?'s':''}</div>
  ${list.length===0?`<div class="empty"><div class="empty-icon">&#x1F4CB;</div><div style="font-size:14px;font-weight:500">Sin resultados</div><div style="font-size:12px;margin-top:6px">Ajusta los filtros o agrega un nuevo empleado.</div></div>`:
  `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:14px">${list.map(empCard).join('')}</div>`}`}

function empCard(e){
  const sup=e.supId?employees.find(x=>x.id===e.supId):null;
  const av=e.foto?`<img src="${esc(e.foto)}" style="width:100%;height:100%;object-fit:cover">`:`<span style="font-size:15px;font-weight:600;color:#fff">${ini(e.nombre,e.apellido)}</span>`;
  const incTag=e.estado==='incapacitado'&&e.incDias?` (${e.incDias}d)`:'';
  return`<div class="emp-card" onclick="openFicha('${e.id}')">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid var(--border)">
      <div class="avatar" style="width:80px;height:80px;border:3px solid ${e.foto?'var(--green)':'var(--border2)'};background:${e.foto?'transparent':avc(e.nombre)}">${av}</div>
      <div style="text-align:center">
        <div style="font-size:14px;font-weight:600">${esc(e.nombre)} ${esc(e.apellido)}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${esc(e.cargo||'Sin cargo')}${e.depto?' · '+esc(e.depto):''}</div>
      </div>
    </div>
    <div class="ponche-block">
      <span class="ponche-lbl">N° Ponche</span>
      <span class="ponche-val">${esc(e.ponche||'—')}</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:2px">
      <span class="badge b-${e.rol||'empleado'}">${e.rol||'empleado'}</span>
      <span class="badge b-${e.estado||'activo'}"><span class="dot dot-${e.estado||'activo'}"></span>${e.estado||'activo'}${incTag}</span>
    </div>
    ${sup?`<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-size:11px;color:var(--text2)">Supervisor: <strong style="font-weight:500;color:var(--text)">${esc(sup.nombre)} ${esc(sup.apellido)}</strong></div>`:''}
  </div>`}

/* ─── SUPERVISORES ─── */
function supViewHTML(){
  const sups=employees.filter(e=>e.rol==='supervisor'||e.rol==='gerente');
  if(!sups.length)return`<div class="empty"><div class="empty-icon">&#x1F464;</div><div style="font-size:14px;font-weight:500">No hay supervisores</div><div style="font-size:12px;margin-top:6px">Agrega empleados con rol Supervisor o Gerente.</div></div>`;
  return sups.map(sup=>{
    const team=employees.filter(e=>e.supId===sup.id);
    const av=sup.foto?`<img src="${esc(sup.foto)}" style="width:100%;height:100%;object-fit:cover">`:
      `<span style="font-weight:600;font-size:16px;color:#fff">${ini(sup.nombre,sup.apellido)}</span>`;
    return`<div class="sup-group">
      <div class="sup-header">
        <div class="avatar" style="width:64px;height:64px;border:2px solid ${sup.foto?'var(--green)':'var(--border2)'};background:${sup.foto?'transparent':avc(sup.nombre)}">${av}</div>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:600">${esc(sup.nombre)} ${esc(sup.apellido)}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">${esc(sup.cargo||sup.rol)} · ${esc(sup.depto||'—')}</div>
          <div style="display:inline-block;background:var(--green-light);border-radius:6px;padding:2px 10px;margin-top:5px;font-size:11px;font-weight:600;color:var(--green-text)">Ponche: ${esc(sup.ponche)}</div>
        </div>
        <span class="badge b-${sup.rol}">${sup.rol}</span>
      </div>
      <div class="sup-body">
        <div style="font-size:12px;font-weight:500;color:var(--text2);padding:10px 0 4px">Equipo asignado · ${team.length} persona${team.length!==1?'s':''}</div>
        ${team.length===0?`<div style="font-size:12px;color:var(--text2);padding:10px 0;font-style:italic">Sin empleados asignados.</div>`:
        team.map(t=>{
          const tav=t.foto?`<img src="${esc(t.foto)}" style="width:100%;height:100%;object-fit:cover">`:
            `<span style="font-size:12px;font-weight:600;color:#fff">${ini(t.nombre,t.apellido)}</span>`;
          const incT=t.estado==='incapacitado'&&t.incDias?` (${t.incDias}d)`:'';
          return`<div class="sup-row">
            <div class="avatar" style="width:34px;height:34px;background:${t.foto?'transparent':avc(t.nombre)}">${tav}</div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:500">${esc(t.nombre)} ${esc(t.apellido)}</div>
              <div style="font-size:11px;color:var(--text2)">${esc(t.cargo||'—')} · Ponche: <strong style="color:var(--text)">${esc(t.ponche)}</strong></div>
            </div>
            <span class="badge b-${t.estado||'activo'}" style="margin-right:8px"><span class="dot dot-${t.estado||'activo'}"></span>${t.estado||'activo'}${incT}</span>
            <button class="btn btn-sm" onclick="event.stopPropagation();openFicha('${t.id}')">Ver ficha</button>
          </div>`}).join('')}
      </div>
    </div>`}).join('');
}

/* ─── DASHBOARD ─── */
function dashHTML(){
  const total=employees.length;
  const cActivo=employees.filter(e=>e.estado==='activo'||!e.estado).length;
  const cInac=employees.filter(e=>e.estado==='inactivo').length;
  const cIncap=employees.filter(e=>e.estado==='incapacitado').length;
  const cDesp=employees.filter(e=>e.estado==='despedido').length;
  const cSup=employees.filter(e=>e.rol==='supervisor'||e.rol==='gerente').length;
  const byD={};employees.forEach(e=>{const d=e.depto||'Sin departamento';byD[d]=(byD[d]||0)+1});
  const byR={};employees.forEach(e=>{const r=e.rol||'empleado';byR[r]=(byR[r]||0)+1});
  const recent=[...employees].sort((a,b)=>b.id-a.id).slice(0,6);
  const stats=[['Total',total,'var(--green)'],['Activos',cActivo,'var(--green)'],['Inactivos',cInac,'#888780'],['Incapacitados',cIncap,'var(--amber)'],['Despedidos',cDesp,'var(--red)'],['Supervisores',cSup,'var(--purple)']];
  return`
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px">
    ${stats.map(([l,n,c])=>`<div class="stat-card"><div class="stat-num" style="color:${c}">${n}</div><div class="stat-lbl">${l}</div></div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
    <div class="card" style="padding:16px">
      <div class="section-title">Por departamento</div>
      ${Object.entries(byD).sort((a,b)=>b[1]-a[1]).map(([d,n])=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <div style="flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d)}</div>
          <div style="font-size:12px;font-weight:500;min-width:18px;text-align:right">${n}</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${total?Math.round(n/total*100):0}%"></div></div>
        </div>`).join('')||`<div style="font-size:12px;color:var(--text2);font-style:italic">Sin datos</div>`}
    </div>
    <div class="card" style="padding:16px">
      <div class="section-title">Por rol</div>
      ${Object.entries(byR).map(([r,n])=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span class="badge b-${r}" style="min-width:85px;justify-content:center">${r}</span>
          <div class="bar-bg" style="flex:1;width:auto"><div class="bar-fill" style="width:${total?Math.round(n/total*100):0}%"></div></div>
          <div style="font-size:12px;font-weight:500;min-width:18px">${n}</div>
        </div>`).join('')||`<div style="font-size:12px;color:var(--text2);font-style:italic">Sin datos</div>`}
    </div>
  </div>
  <div class="card" style="padding:16px">
    <div class="section-title">Empleados recientes</div>
    ${recent.length===0?`<div style="font-size:12px;color:var(--text2);font-style:italic">Sin datos</div>`:
    recent.map((e,i)=>{
      const av=e.foto?`<img src="${esc(e.foto)}" style="width:100%;height:100%;object-fit:cover">`:
        `<span style="font-size:12px;font-weight:600;color:#fff">${ini(e.nombre,e.apellido)}</span>`;
      const incT=e.estado==='incapacitado'&&e.incDias?` (${e.incDias}d)`:'';
      return`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;${i<recent.length-1?'border-bottom:1px solid var(--border)':''}">
        <div class="avatar" style="width:36px;height:36px;background:${e.foto?'transparent':avc(e.nombre)}">${av}</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:500">${esc(e.nombre)} ${esc(e.apellido)}</div><div style="font-size:11px;color:var(--text2)">Ponche: ${esc(e.ponche)} · ${esc(e.cargo||'—')}</div></div>
        <span class="badge b-${e.estado||'activo'}"><span class="dot dot-${e.estado||'activo'}"></span>${e.estado||'activo'}${incT}</span>
        <button class="btn btn-sm" onclick="openFicha('${e.id}')">Ver ficha</button>
      </div>`}).join('')}
  </div>`}

/* ─── FORM ─── */
function supOptions(cur,excl){
  return`<option value="">Sin supervisor</option>`+
    employees.filter(e=>(e.rol==='supervisor'||e.rol==='gerente')&&e.id!==excl)
    .map(s=>`<option value="${s.id}"${s.id===cur?' selected':''}>${esc(s.nombre)} ${esc(s.apellido)} — Ponche ${esc(s.ponche)}</option>`).join('');
}

function formHTML(e){
  const isInc=e&&e.estado==='incapacitado';
  const deptos=['Ventas','Caja','Almacén','Seguridad','Limpieza','Administración','Recursos Humanos','Tecnología','Mantenimiento','Otro'];
  return`
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border)">
    <div id="photo-wrap" class="photo-upload-area" onclick="document.getElementById('photo-inp').click()" title="Subir foto" style="width:96px;height:96px">
      ${e&&e.foto?`<img src="${esc(e.foto)}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">`:
      `<div style="text-align:center"><div style="font-size:20px;opacity:.4">&#x1F4F7;</div><div style="font-size:10px;color:var(--text2);margin-top:2px">Foto</div></div>`}
      <input type="file" id="photo-inp" accept="image/*" style="display:none" onchange="previewPhoto(event)">
    </div>
    <div style="flex:1">
      <label>N° de Ponche *</label>
      <input id="f-ponche" value="${esc(e?e.ponche||'':'')}" placeholder="Ej: P-0001" style="font-size:22px;font-weight:700;border-color:var(--green);letter-spacing:2px;color:var(--green-text)">
    </div>
  </div>
  <div class="form-grid">
    <div><label>Nombre *</label><input id="f-nombre" value="${esc(e?e.nombre||'':'')}" placeholder="Nombre"></div>
    <div><label>Apellido *</label><input id="f-apellido" value="${esc(e?e.apellido||'':'')}" placeholder="Apellido"></div>
    <div><label>Cédula</label><input id="f-cedula" value="${esc(e?e.cedula||'':'')}" placeholder="000-0000000-0"></div>
    <div><label>Teléfono</label><input id="f-tel" value="${esc(e?e.tel||'':'')}" placeholder="809-000-0000"></div>
    <div><label>Cargo / Posición</label><input id="f-cargo" value="${esc(e?e.cargo||'':'')}" placeholder="Ej: Cajero, Guardia..."></div>
    <div><label>Departamento</label>
      <select id="f-depto"><option value="">Seleccionar...</option>${deptos.map(d=>`<option${e&&e.depto===d?' selected':''}>${esc(d)}</option>`).join('')}</select>
    </div>
    <div><label>Rol</label>
      <select id="f-rol">
        <option value="empleado"${!e||e.rol==='empleado'?' selected':''}>Empleado</option>
        <option value="supervisor"${e&&e.rol==='supervisor'?' selected':''}>Supervisor</option>
        <option value="gerente"${e&&e.rol==='gerente'?' selected':''}>Gerente</option>
        <option value="admin"${e&&e.rol==='admin'?' selected':''}>Administrador</option>
      </select>
    </div>
    <div><label>Supervisor asignado</label><select id="f-sup">${supOptions(e?e.supId:null,e?e.id:null)}</select></div>
    <div><label>Estado</label>
      <select id="f-estado" onchange="toggleIncDias(this.value)">
        <option value="activo"${!e||e.estado==='activo'?' selected':''}>Activo</option>
        <option value="inactivo"${e&&e.estado==='inactivo'?' selected':''}>Inactivo</option>
        <option value="incapacitado"${e&&e.estado==='incapacitado'?' selected':''}>Incapacitado</option>
        <option value="despedido"${e&&e.estado==='despedido'?' selected':''}>Despedido</option>
      </select>
    </div>
    <div id="inc-wrap" style="${isInc?'':'display:none'}">
      <label>Días de incapacidad</label>
      <input id="f-incDias" type="number" min="1" max="365" value="${e&&e.incDias||''}" placeholder="Ej: 7 días">
    </div>
    <div><label>Fecha de ingreso</label><input id="f-ingreso" type="date" value="${esc(e?e.ingreso||today():today())}"></div>
    <div><label>Email</label><input id="f-email" type="email" value="${esc(e?e.email||'':'')}" placeholder="correo@ejemplo.com"></div>
    <div class="full"><label>Dirección completa</label><input id="f-dir" value="${esc(e?e.dir||'':'')}" placeholder="Calle, sector, ciudad..."></div>
    <div class="full"><label>Notas internas</label><textarea id="f-notas" rows="2" style="resize:none">${esc(e?e.notas||'':'')}</textarea></div>
  </div>`}

function toggleIncDias(val){const w=document.getElementById('inc-wrap');if(w)w.style.display=val==='incapacitado'?'block':'none'}

function previewPhoto(ev){
  const file=ev.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    photoData=e.target.result;
    const w=document.getElementById('photo-wrap');
    if(w)w.innerHTML=`<img src="${photoData}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:50%"><input type="file" id="photo-inp" accept="image/*" style="display:none" onchange="previewPhoto(event)">`;
  };
  r.readAsDataURL(file);
}

/* ─── CRUD ─── */
function openNew(){editId=null;photoData=null;showModal('Nuevo empleado',formHTML(null),[{l:'Cancelar',c:'btn',f:'closeModal()'},{l:'Guardar empleado',c:'btn btn-primary',f:'saveEmp()'}])}

function openEdit(id){
  editId=id;const e=employees.find(x=>x.id===id);if(!e)return;
  photoData=e.foto||null;
  showModal('Editar empleado',formHTML(e),[{l:'Cancelar',c:'btn',f:'closeModal()'},{l:'Guardar cambios',c:'btn btn-primary',f:'saveEmp()'}]);
}

function saveEmp(){
  const ponche=(document.getElementById('f-ponche')||{}).value?.trim();
  const nombre=(document.getElementById('f-nombre')||{}).value?.trim();
  const apellido=(document.getElementById('f-apellido')||{}).value?.trim();
  if(!ponche){alert('El N° de Ponche es obligatorio.');return}
  if(!nombre){alert('El nombre es obligatorio.');return}
  if(employees.find(e=>e.ponche===ponche&&e.id!==editId)){alert('Ya existe un empleado con ese número de Ponche.');return}
  const estado=document.getElementById('f-estado').value;
  const emp={
    id:editId||Date.now().toString(),ponche,nombre,apellido,
    cedula:document.getElementById('f-cedula').value.trim(),
    tel:document.getElementById('f-tel').value.trim(),
    cargo:document.getElementById('f-cargo').value.trim(),
    depto:document.getElementById('f-depto').value,
    rol:document.getElementById('f-rol').value,
    supId:document.getElementById('f-sup').value||null,
    estado,
    incDias:estado==='incapacitado'?(parseInt(document.getElementById('f-incDias').value)||null):null,
    ingreso:document.getElementById('f-ingreso').value,
    email:document.getElementById('f-email').value.trim(),
    dir:document.getElementById('f-dir').value.trim(),
    notas:document.getElementById('f-notas').value.trim(),
    foto:photoData||null
  };
  if(editId)employees=employees.map(x=>x.id===editId?emp:x);
  else employees.push(emp);
  saveData();closeModal();render();
}

/* ─── FICHA ─── */
function openFicha(id){
  fichaId=id;const e=employees.find(x=>x.id===id);if(!e)return;
  const sup=e.supId?employees.find(x=>x.id===e.supId):null;
  const av=e.foto?`<img src="${esc(e.foto)}" style="width:100%;height:100%;object-fit:cover">`:
    `<span style="font-size:36px;font-weight:700;color:#fff">${ini(e.nombre,e.apellido)}</span>`;
  const incInfo=e.estado==='incapacitado'&&e.incDias?` · ${e.incDias} día(s) de incapacidad`:'';
  const rows=[
    ['Cédula / ID',e.cedula||'—'],
    ['Teléfono',e.tel||'—'],
    ['Email',e.email||'—'],
    ['Dirección',e.dir||'—'],
    ['Fecha de ingreso',fmtDate(e.ingreso)],
    ['Departamento',e.depto||'—'],
    ['Supervisor',sup?`${esc(sup.nombre)} ${esc(sup.apellido)} — Ponche ${esc(sup.ponche)}`:'Sin supervisor asignado'],
    ['Estado',`${e.estado||'activo'}${incInfo}`],
  ];
  const body=`
  <div class="ficha-wrap">
    <div class="ficha-top">
      <div style="width:38px;height:38px;background:rgba(255,255,255,.22);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700">KM</div>
      <div style="flex:1;color:#fff">
        <div style="font-size:16px;font-weight:600">Kindo Mall</div>
        <div style="font-size:11px;opacity:.85">Ficha Oficial de Empleado</div>
      </div>
      <span class="badge" style="background:rgba(255,255,255,.2);color:#fff">${e.rol||'empleado'}</span>
    </div>
    <div class="ficha-body">
      <div class="ficha-center">
        <div class="ficha-avatar" style="background:${e.foto?'transparent':avc(e.nombre)}">${av}</div>
        <div class="ficha-ponche">
          <div style="font-size:10px;color:var(--green-dark);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px">N° de Ponche</div>
          <div style="font-size:28px;font-weight:700;color:var(--green-text);letter-spacing:3px">${esc(e.ponche)}</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:20px;font-weight:600">${esc(e.nombre)} ${esc(e.apellido)}</div>
          <div style="font-size:13px;color:var(--text2);margin-top:3px">${esc(e.cargo||'Sin cargo')}${e.depto?' · '+esc(e.depto):''}</div>
        </div>
      </div>
      <table class="ficha-table">
        ${rows.map(([l,v])=>`<tr><td>${l}</td><td>${v}</td></tr>`).join('')}
      </table>
      ${e.notas?`<div style="margin-top:14px;padding:10px 12px;background:var(--bg3);border-radius:var(--radius);font-size:12px;color:var(--text2)"><strong style="color:var(--text);font-weight:500">Notas:</strong> ${esc(e.notas)}</div>`:''}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
        <span class="badge b-${e.estado||'activo'}"><span class="dot dot-${e.estado||'activo'}"></span>${e.estado||'activo'}${e.incDias&&e.estado==='incapacitado'?' ('+e.incDias+' días)':''}</span>
        <span style="font-size:11px;color:var(--text3)">Kindo Mall · Sistema de Personal</span>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin-top:14px">
    <button class="btn btn-danger btn-sm" onclick="deleteEmp('${e.id}')">Eliminar empleado</button>
  </div>`;
  showModal('Ficha de empleado',body,[{l:'Cerrar',c:'btn',f:'closeModal()'},{l:'Editar empleado',c:'btn btn-primary',f:`editFromFicha('${e.id}')`}]);
}

function editFromFicha(id){closeModal();setTimeout(()=>openEdit(id),80)}

function deleteEmp(id){
  if(!confirm('¿Eliminar este empleado permanentemente?'))return;
  employees=employees.filter(e=>e.id!==id);
  employees.forEach(e=>{if(e.supId===id)e.supId=null});
  saveData();closeModal();render();
}

/* ─── MODAL ─── */
function showModal(title,body,btns){
  document.getElementById('modal-ttl').textContent=title;
  document.getElementById('modal-bdy').innerHTML=body;
  document.getElementById('modal-ftr').innerHTML=btns.map(b=>`<button class="${b.c}" onclick="${b.f}">${b.l}</button>`).join('');
  document.getElementById('modal-layer').classList.add('open');
}
function closeModal(){document.getElementById('modal-layer').classList.remove('open')}
document.getElementById('modal-layer').addEventListener('click',function(e){if(e.target===this)closeModal()});

loadData();
</script>
</body>
</html>
